[tox]
envlist = py313,lint
isolated_build = true

[testenv]
extras = dev
deps = pytest-timeout
commands = pytest --timeout=600 -m "not performance" {posargs}

[testenv:lint]
skip_install = true
deps =
    flake8
    black
    isort
commands =
    black --check src/ tests/
    isort --check-only src/ tests/
    flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .tox
