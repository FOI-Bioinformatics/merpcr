[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0.0", "numpy>=1.24.0"]
build-backend = "setuptools.build_meta"

[project]
name = "merpcr"
version = "1.0.3"
description = "Modern Electronic Rapid PCR - Python reimplementation of me-PCR"
authors = [
    {name = "merPCR Contributors"},
]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bioinformatics", "pcr", "sts", "sequence-analysis", "genomics"]

[project.urls]
Homepage = "https://github.com/merpcr/merpcr"
Repository = "https://github.com/merpcr/merpcr"
Issues = "https://github.com/merpcr/merpcr/issues"

[project.scripts]
merpcr = "merpcr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-timeout",
    "hypothesis",
    "psutil",
    "black",
    "isort",
    "flake8",
    "mypy",
    "Cython>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*.pyx"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: integration tests",
    "performance: performance tests",
    "cli: command-line interface tests",
    "unit: unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/merpcr"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.coverage.html]
directory = "htmlcov"
